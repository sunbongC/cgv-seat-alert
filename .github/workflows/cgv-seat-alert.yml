name: CGV seat alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-seats:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - movie_name: "회생"
            theater_code: "0040"
            theater_keyword: "압구정"
            theater_name: "CGV 압구정 (1회차)"
            play_date: "20261126"
            start_time: "17:20"
          - movie_name: "회생"
            theater_code: "0040"
            theater_keyword: "압구정"
            theater_name: "CGV 압구정 (2회차)"
            play_date: "20261130"
            start_time: "19:50"
          - movie_name: "그날의 태주"
            theater_code: "0107"
            theater_keyword: "청담"
            theater_name: "CGV 청담씨네시티 (1회차)"
            play_date: "20261128"
            start_time: "16:40"
          - movie_name: "그날의 태주"
            theater_code: "0040"
            theater_keyword: "압구정"
            theater_name: "CGV 압구정 (2회차)"
            play_date: "20261201"
            start_time: "14:10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Check CGV seats
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          THEATER_CODE: ${{ matrix.target.theater_code }}
          THEATER_KEYWORD: ${{ matrix.target.theater_keyword }}
          THEATER_NAME: ${{ matrix.target.theater_name }}
          MOVIE_NAME: ${{ matrix.target.movie_name }}
          PLAY_DATE: ${{ matrix.target.play_date }}
          START_TIME: ${{ matrix.target.start_time }}
        run: python main.py
