name: CGV seat alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  check-seats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        target:
          - movie_name: "회생"
            theater_code: "0040"
            theater_keyword: "압구정"
            theater_name: "CGV 압구정 (회생 1회차)"
            play_date: "20261126"
            start_time: "17:20"
          - movie_name: "회생"
            theater_code: "0040"
            theater_keyword: "압구정"
            theater_name: "CGV 압구정 (회생 2회차)"
            play_date: "20261130"
            start_time: "19:50"
          - movie_name: "그날의 태주"
            theater_code: "0107"
            theater_keyword: "청담"
            theater_name: "CGV 청담씨네시티 (태주 1회차)"
            play_date: "20261128"
            start_time: "16:40"
          - movie_name: "그날의 태주"
            theater_code: "0040"
            theater_keyword: "압구정"
            theater_name: "CGV 압구정 (태주 2회차)"
            play_date: "20261201"
            start_time: "14:10"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Prepare environment & config
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          cp config.example.json config.json

      - name: Check CGV seats
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ALERT_SOURCE: "Actions"
          THEATER_CODE: ${{ matrix.target.theater_code }}
          THEATER_KEYWORD: ${{ matrix.target.theater_keyword }}
          THEATER_NAME: ${{ matrix.target.theater_name }}
          MOVIE_NAME: ${{ matrix.target.movie_name }}
          PLAY_DATE: ${{ matrix.target.play_date }}
          START_TIME: ${{ matrix.target.start_time }}
        run: python -u monitor.py --once --any-seat
